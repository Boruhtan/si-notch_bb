name: Bug report
description: Report a reproducible problem.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: si-notch version, macOS version, Mac model, agent and version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant settings and what you did.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostics
      description: Remove private session content, paths and credentials before sharing.
