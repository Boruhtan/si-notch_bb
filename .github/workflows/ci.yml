name: macOS
on:
  push:
    branches: [main, codex/remote-ssh-beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/test.sh
      - run: scripts/build-app.sh release
      - run: scripts/verify-release.sh
      - run: scripts/build-dmg.sh
